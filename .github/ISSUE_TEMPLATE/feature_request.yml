name: Feature request
description: Something Ritele should do that it doesn't yet
labels: ["feature request"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the job, not the solution. "During incidents I can't tell which deploy…" beats "add a deploy button".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: dropdown
    id: plan
    attributes:
      label: Which plan are you on?
      options:
        - Free
        - Growth
        - Scale
        - Enterprise
        - Evaluating
